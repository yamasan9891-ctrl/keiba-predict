name: Auto-Tune Strategy (Monthly)

on:
  schedule:
    # 毎月1日 22:00 JST (=13:00 UTC) に実行
    - cron: "0 13 1 * *"
  workflow_dispatch: {}

jobs:
  auto-tune:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "keiba-bot"
          git config user.email "keiba-bot@users.noreply.github.com"

      - name: Auto-tune strategy config
        run: python -u betting/auto_tune.py

      - name: Commit any remaining changes
        if: always()
        run: |
          git add -f data/keiba.db
          git diff --cached --quiet && echo "変更なし、コミットをスキップします" && exit 0
          git commit -m "auto-tune safety commit"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push成功（${i}回目）"
              exit 0
            fi
            echo "push失敗（${i}回目）。最新を取り込んで再試行します..."
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout --ours data/keiba.db 2>/dev/null || true
              git add data/keiba.db
              git -c core.editor=true rebase --continue || git rebase --abort
            fi
            sleep 5
          done
          echo "::error::5回試行してもpushできませんでした。手動確認が必要です。"
          exit 1
