name: Auto-Tune Strategy (Monthly)

on:
  schedule:
    # 毎月1日 22:00 JST (=13:00 UTC) に実行
    - cron: "0 13 1 * *"
  workflow_dispatch: {}

jobs:
  auto-tune:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "keiba-bot"
          git config user.email "keiba-bot@users.noreply.github.com"

      - name: Auto-tune strategy config
        run: python -u betting/auto_tune.py

      - name: Commit any remaining changes
        if: always()
        run: |
          git add -f data/keiba.db
          git diff --cached --quiet || git commit -m "auto-tune safety commit"
          git push || echo "push対象なし、または失敗"
