name: Auto Backfill Dates (Scheduled)

on:
  schedule:
    # 3時間ごとに未取得の開催日を300件ずつ埋める
    - cron: "30 */3 * * *"
  workflow_dispatch: {}

jobs:
  backfill-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "keiba-bot"
          git config user.email "keiba-bot@users.noreply.github.com"

      - name: Backfill dates
        run: python -u scraper/backfill_dates.py --limit 300

      - name: Commit any remaining data
        if: always()
        run: |
          git add -f data/keiba.db
          git diff --cached --quiet && echo "変更なし、コミットをスキップします" && exit 0
          git commit -m "backfill dates safety commit"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push成功（${i}回目）"
              exit 0
            fi
            echo "push失敗（${i}回目）。最新を取り込んで再試行します..."
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout --ours data/keiba.db 2>/dev/null || true
              git add data/keiba.db
              git -c core.editor=true rebase --continue || git rebase --abort
            fi
            sleep 5
          done
          echo "::error::5回試行してもpushできませんでした。手動確認が必要です。"
          exit 1
