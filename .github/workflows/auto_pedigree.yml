name: Auto Pedigree Collection (Scheduled)

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

jobs:
  pedigree:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "keiba-bot"
          git config user.email "keiba-bot@users.noreply.github.com"
      - name: Show current progress
        run: python -u scraper/pedigree_scraper.py --status
      - name: Collect pedigrees
        run: python -u scraper/pedigree_scraper.py --limit 200
      - name: Commit any remaining data
        if: always()
        run: |
          git add -f data/keiba.db
          git diff --cached --quiet || git commit -m "pedigree auto-collect safety commit"
          git push || echo "push対象なし、または失敗（既にcommit済みの可能性）"