name: Backfill Historical Races

on:
  workflow_dispatch:
    inputs:
      year:
        description: "収集する年（例: 2016）"
        required: true
        type: string
      courses:
        description: "競馬場コード（カンマ区切り）例: 05,06 ※2〜3場ずつ推奨"
        required: false
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "keiba-bot"
          git config user.email "keiba-bot@users.noreply.github.com"
      - name: Run bulk collection
        run: |
          if [ -n "${{ inputs.courses }}" ]; then
            python -u scraper/bulk_collect.py --year ${{ inputs.year }} --courses ${{ inputs.courses }}
          else
            python -u scraper/bulk_collect.py --year ${{ inputs.year }}
          fi
      - name: Commit any remaining data
        if: always()
        run: |
          git add -f data/keiba.db
          git diff --cached --quiet || git commit -m "backfill (final safety commit): ${{ inputs.year }}年"
          git push || echo "push対象なし、またはpush失敗（既にcommit済みの可能性）"