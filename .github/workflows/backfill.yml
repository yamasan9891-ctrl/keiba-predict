name: Backfill Historical Races

on:
  workflow_dispatch:
    inputs:
      year:
        description: "収集する年（例: 2016）"
        required: true
        type: string
      courses:
        description: "競馬場コード（カンマ区切り）例: 05,06 ※2〜3場ずつ推奨"
        required: false
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "keiba-bot"
          git config user.email "keiba-bot@users.noreply.github.com"
      - name: Run bulk collection
        run: |
          if [ -n "${{ inputs.courses }}" ]; then
            python -u scraper/bulk_collect.py --year ${{ inputs.year }} --courses ${{ inputs.courses }}
          else
            python -u scraper/bulk_collect.py --year ${{ inputs.year }}
          fi
      - name: Commit any remaining data
        if: always()
        run: |
          git add -f data/keiba.db
          git diff --cached --quiet && echo "変更なし、コミットをスキップします" && exit 0
          git commit -m "backfill (final safety commit): ${{ inputs.year }}年"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push成功（${i}回目）"
              exit 0
            fi
            echo "push失敗（${i}回目）。最新を取り込んで再試行します..."
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout --ours data/keiba.db 2>/dev/null || true
              git add data/keiba.db
              git -c core.editor=true rebase --continue || git rebase --abort
            fi
            sleep 5
          done
          echo "::error::5回試行してもpushできませんでした。手動確認が必要です。"
          exit 1