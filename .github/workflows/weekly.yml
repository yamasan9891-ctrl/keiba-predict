name: Weekly Keiba Update

on:
  schedule:
    # 木曜21時JST: 出馬表確定後の最初の予想生成
    - cron: "0 12 * * 4"
    # 金曜21時JST: 金曜中の変更（追加情報・天気予報の更新等）を反映
    - cron: "0 12 * * 5"
    # 土曜6時JST: 土曜開催分の直前情報（出走取消・最終に近いオッズ）を反映
    - cron: "0 21 * * 5"
    # 日曜6時JST: 日曜開催分の直前情報を反映
    - cron: "0 21 * * 6"
  workflow_dispatch: {}   # 手動実行ボタンも使えるようにする

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "keiba-bot"
          git config user.email "keiba-bot@users.noreply.github.com"

      - name: Build features from DB
        run: python -u features/feature_engineering.py

      - name: Train model (fresh, using all accumulated data)
        run: python -u model/train.py

      - name: Run weekly pipeline (fetch races, predict, generate site)
        run: python -u weekly_pipeline.py

      - name: Commit updated data & site
        if: always()
        run: |
          git add -f data/keiba.db static_site/dist
          git diff --cached --quiet || git commit -m "weekly update: $(date +'%Y-%m-%d')"
          git push || echo "push対象なし、または失敗"

  deploy-pages:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static_site/dist
      - uses: actions/deploy-pages@v4
