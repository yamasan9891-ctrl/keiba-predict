name: Weekly Keiba Update

on:
  schedule:
    # 木曜21時JST: 出馬表確定後の最初の予想生成
    - cron: "0 12 * * 4"
    # 金曜21時JST: 金曜中の変更（追加情報・天気予報の更新等）を反映
    - cron: "0 12 * * 5"
    # 土曜6時JST: 土曜開催分の直前情報（出走取消・最終に近いオッズ）を反映
    - cron: "0 21 * * 5"
    # 日曜6時JST: 日曜開催分の直前情報を反映
    - cron: "0 21 * * 6"
  workflow_dispatch: {}   # 手動実行ボタンも使えるようにする

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "keiba-bot"
          git config user.email "keiba-bot@users.noreply.github.com"

      - name: Build features from DB
        run: python -u features/feature_engineering.py

      - name: Train model (fresh, using all accumulated data)
        run: python -u model/train.py

      - name: Run weekly pipeline (fetch races, predict, generate site)
        run: python -u weekly_pipeline.py

      - name: Resolve tracked bets against confirmed results
        run: python -u betting/resolve_bets.py

      - name: Regenerate performance page
        run: |
          python -u -c "
          import datetime
          from db.database import init_db, get_conn, all_resolved_bets, unresolved_bets
          from static_site.generate_site import generate_performance_page
          init_db()
          this_year = datetime.date.today().year
          with get_conn() as conn:
              summary_bets = all_resolved_bets(conn, year=this_year, strategy='value')
              display_bets = all_resolved_bets(conn, year=this_year, limit=100, strategy='value')
              pending = len([b for b in unresolved_bets(conn) if b.get('strategy','value')=='value'])
              fav_summary = all_resolved_bets(conn, year=this_year, strategy='favorite')
              fav_display = all_resolved_bets(conn, year=this_year, limit=100, strategy='favorite')
              fav_pending = len([b for b in unresolved_bets(conn) if b.get('strategy')=='favorite'])
          generate_performance_page(summary_bets, display_bets, pending, favorite_summary_bets=fav_summary, favorite_display_bets=fav_display, favorite_pending_count=fav_pending)
          print(f'収支ページ生成: {this_year}年 集計{len(summary_bets)}件 / 堅い本命{len(fav_summary)}件')
          "

      - name: Regenerate archive page (last 7 days only)
        run: |
          python -u -c "
          from db.database import init_db, get_conn, list_archived_races
          from static_site.generate_site import generate_archive_page
          init_db()
          with get_conn() as conn:
              races = list_archived_races(conn, days=7)
          generate_archive_page(races)
          print(f'アーカイブページ生成: 直近7日分 {len(races)}件')
          "

      - name: Clean up old race pages (older than 14 days)
        run: |
          python -u -c "
          from db.database import init_db, get_conn, cleanup_old_race_pages
          init_db()
          with get_conn() as conn:
              deleted = cleanup_old_race_pages('static_site/dist/races', conn, days=14)
          print(f'古いレースページを削除: {deleted}件')
          "


      - name: Commit updated data & site
        if: always()
        run: |
          git add -f data/keiba.db static_site/dist
          git diff --cached --quiet && echo "変更なし、コミットをスキップします" && exit 0
          git commit -m "weekly update: $(date +'%Y-%m-%d')"
          # 他の自動ジョブ（結果チェック・血統収集等）と同時にpushして
          # 競合（rejected）することがあるため、失敗したら最新を取り込んで
          # 再pushする（最大5回まで試す）。data/keiba.dbはバイナリで自動マージ
          # できないため、コンフリクト時は「今回生成した方」を正として採用する。
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push成功（${i}回目）"
              exit 0
            fi
            echo "push失敗（${i}回目）。最新を取り込んで再試行します..."
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout --ours data/keiba.db 2>/dev/null || true
              git add data/keiba.db
              git -c core.editor=true rebase --continue || git rebase --abort
            fi
            sleep 5
          done
          echo "::error::5回試行してもpushできませんでした。手動確認が必要です。"
          exit 1

  deploy-pages:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static_site/dist
      - uses: actions/deploy-pages@v4
