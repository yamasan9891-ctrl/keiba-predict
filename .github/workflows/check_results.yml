name: Check Race Results (Frequent)

on:
  schedule:
    # 土日 10:00〜17:00 JST（=UTC 1:00〜8:00）の間、1時間おきにチェック
    # JRAのレースはこの時間帯に集中しているため
    - cron: "0 1-8 * * 6,0"
  workflow_dispatch: {}

jobs:
  check-results:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "keiba-bot"
          git config user.email "keiba-bot@users.noreply.github.com"

      - name: Check and update results
        run: python -u scraper/check_results.py

      - name: Commit any remaining changes
        if: always()
        run: |
          git add -f data/keiba.db static_site/dist
          git diff --cached --quiet && echo "変更なし、コミットをスキップします" && exit 0
          git commit -m "result check safety commit"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push成功（${i}回目）"
              exit 0
            fi
            echo "push失敗（${i}回目）。最新を取り込んで再試行します..."
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout --ours data/keiba.db 2>/dev/null || true
              git add data/keiba.db
              git -c core.editor=true rebase --continue || git rebase --abort
            fi
            sleep 5
          done
          echo "::error::5回試行してもpushできませんでした。手動確認が必要です。"
          exit 1

  deploy-pages:
    needs: check-results
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static_site/dist
      - uses: actions/deploy-pages@v4
