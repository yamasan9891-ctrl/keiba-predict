<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今週のレース予想 | keiba-predict</title>
<style>
  :root {
    --bg: #0b0f0d;
    --surface: #131a16;
    --surface-2: #1a2420;
    --line: #26332c;
    --amber: #f0a202;
    --amber-dim: #8a6417;
    --green: #4caf6e;
    --red: #d64550;
    --text: #ece7da;
    --text-dim: #8d9690;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", -apple-system, sans-serif;
    padding: 0 0 64px;
  }
  .mono { font-family: "SFMono-Regular", "Menlo", "Consolas", monospace; font-variant-numeric: tabular-nums; }

  header {
    padding: 28px 18px 20px;
    border-bottom: 1px solid var(--line);
    background:
      repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(240,162,2,0.02) 3px, rgba(240,162,2,0.02) 4px),
      var(--bg);
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--amber-dim);
    text-transform: uppercase;
    margin: 0 0 8px;
  }
  h1 {
    font-size: 22px;
    letter-spacing: 0.02em;
    margin: 0 0 6px;
    font-weight: 800;
  }
  .updated {
    color: var(--text-dim);
    font-size: 12px;
  }
  .updated .dot { color: var(--green); }

  main { max-width: 720px; margin: 0 auto; padding: 0 14px; }

  .notice {
    margin-top: 18px;
    font-size: 12.5px;
    color: var(--text-dim);
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--amber-dim);
    border-radius: 4px;
    padding: 11px 14px;
    line-height: 1.6;
  }

  .day-block { margin-top: 26px; }
  .day-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--amber);
    margin: 0 0 10px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .day-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .race-card {
    display: block;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 8px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .race-card:active { background: var(--surface-2); }
  .race-card .row1 {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .race-card .name { font-weight: 700; font-size: 14.5px; }
  .race-card .rnum { color: var(--amber); font-weight: 800; margin-right: 6px; }
  .race-card .meta {
    font-size: 11.5px;
    color: var(--text-dim);
    margin-top: 5px;
    letter-spacing: 0.02em;
  }
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 2px 7px;
    border-radius: 3px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .badge.win5 { background: rgba(240,162,2,0.15); color: var(--amber); border: 1px solid var(--amber-dim); }
  .badge.handicap { background: rgba(76,175,110,0.12); color: var(--green); border: 1px solid #2e5c3e; }

  .empty-state {
    margin-top: 40px;
    text-align: center;
    padding: 40px 20px;
    border: 1px dashed var(--line);
    border-radius: 8px;
  }
  .empty-state .board {
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--amber-dim);
    margin-bottom: 10px;
  }
  .empty-state .board::before { content: "◆ "; }
  .empty-state p {
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.7;
    margin: 0;
  }

  footer {
    max-width: 720px;
    margin: 40px auto 0;
    padding: 16px 14px 0;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
  }
</style>
</head>
<body>
<header>
  <p class="eyebrow">JRA Prediction Engine</p>
  <h1>今週のレース予想</h1>
  <p class="updated mono"><span class="dot">●</span> LAST SYNC 2026-08-28 21:52</p>
</header>

<main>
  <div class="notice">予想は参考情報です。的中・利益を保証しません。購入は必ずご自身の判断でIPAT等の公式ルートから行ってください。</div>

  
    <div class="empty-state">
      <div class="board mono">BOARD STANDING BY</div>
      <p>今週開催レースの出馬表はまだ公開されていません。<br>公開され次第、自動で予想を反映します（木曜更新）。</p>
    </div>
  
</main>

<footer>keiba-predict — 自動購入は行いません。すべての投票判断はご自身で。</footer>
</body>
</html>
