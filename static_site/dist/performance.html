<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI収支実績 | keiba-predict</title>
<style>
  :root {
    --bg: #0b0f0d; --surface: #131a16; --surface-2: #1a2420; --line: #26332c;
    --amber: #f0a202; --amber-dim: #8a6417; --green: #4caf6e; --red: #d64550;
    --text: #ece7da; --text-dim: #8d9690;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", -apple-system, sans-serif;
    padding: 0 0 64px;
  }
  .mono { font-family: "SFMono-Regular", "Menlo", "Consolas", monospace; font-variant-numeric: tabular-nums; }
  a { color: inherit; text-decoration: none; }

  header { padding: 20px 14px 14px; border-bottom: 1px solid var(--line); }
  .back { font-size: 12px; color: var(--text-dim); }
  .eyebrow { font-size: 11px; letter-spacing: 0.14em; color: var(--amber-dim); text-transform: uppercase; margin: 10px 0 6px; font-weight: 700; }
  h1 { font-size: 22px; margin: 0 0 6px; font-weight: 800; }
  .updated { color: var(--text-dim); font-size: 11.5px; }

  main { max-width: 720px; margin: 0 auto; padding: 16px 14px 0; }

  .summary-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px;
  }
  .summary-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px;
  }
  .summary-card .label { font-size: 11px; color: var(--text-dim); }
  .summary-card .value { font-size: 22px; font-weight: 800; margin-top: 4px; }
  .summary-card .value.profit-plus { color: var(--green); }
  .summary-card .value.profit-minus { color: var(--red); }
  .summary-card.wide { grid-column: span 2; }

  .section-title {
    font-size: 13.5px; font-weight: 800; margin: 24px 0 10px;
    display: flex; align-items: baseline; gap: 8px;
  }
  .section-title::after { content:""; flex:1; height:1px; background:var(--line); }
  .section-hint { font-size: 11.5px; color: var(--text-dim); margin: -6px 0 10px; line-height: 1.6; }

  .bet-row {
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: 12px 14px; margin-bottom: 8px;
  }
  .bet-row .top { display: flex; justify-content: space-between; align-items: baseline; }
  .bet-row .race-label { font-size: 12px; color: var(--text-dim); }
  .bet-row .result-badge {
    font-size: 11px; font-weight: 800; padding: 2px 9px; border-radius: 10px;
  }
  .result-badge.win { background: rgba(76,175,110,0.15); color: var(--green); }
  .result-badge.lose { background: rgba(214,69,80,0.15); color: var(--red); }
  .bet-row .horses { font-size: 14.5px; font-weight: 700; margin: 6px 0 4px; }
  .bet-row .detail { font-size: 11.5px; color: var(--text-dim); }
  .bet-row .profit { font-weight: 800; }
  .bet-row .profit.plus { color: var(--green); }
  .bet-row .profit.minus { color: var(--red); }

  .empty-state {
    margin-top: 20px; text-align: center; padding: 40px 20px;
    border: 1px dashed var(--line); border-radius: 8px;
  }
  .empty-state p { color: var(--text-dim); font-size: 13px; line-height: 1.7; margin: 0; }

  .disclaimer { margin-top: 26px; font-size: 11px; color: var(--text-dim); text-align: center; line-height: 1.7; }
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">← 今週のレース一覧</a>
  <p class="eyebrow">Performance</p>
  <h1>AI収支実績</h1>
  <p class="updated mono">最終更新 2026-08-31 09:37</p>
</header>

<main>
  <div class="section-hint">毎レース「購入プラン（複数点）」に合計5,000円を按分して購入したと仮定した場合の、実際の収支記録です。</div>

  <div class="summary-grid">
    <div class="summary-card">
      <div class="label">累計収支</div>
      <div class="value mono profit-plus">+0円</div>
    </div>
    <div class="summary-card">
      <div class="label">回収率</div>
      <div class="value mono">-%</div>
    </div>
    <div class="summary-card">
      <div class="label">的中数 / 総数</div>
      <div class="value mono">0 / 0</div>
    </div>
    <div class="summary-card">
      <div class="label">確定待ち</div>
      <div class="value mono">18件</div>
    </div>
  </div>

  <div class="section-title">確定済みの買い目履歴</div>
  
    <div class="empty-state">
      <p>まだ確定した買い目がありません。<br>レースが終わり結果が確定すると、ここに記録されていきます。</p>
    </div>
  

  <div class="disclaimer">この収支記録は、AIの予想精度を検証するための参考記録です。実際の投票判断・購入はご自身の責任で行ってください。</div>
</main>
</body>
</html>
